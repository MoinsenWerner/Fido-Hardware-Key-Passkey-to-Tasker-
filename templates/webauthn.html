<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasker Passkey</title>
<body>
<p id="status">Authentifizierung wird gestartet …</p>
<pre id="result"></pre>
<script>
const initial = {{ {"mode": mode, "username": username, "password": password, "type": passkey_type}|tojson }};
const decode = value => Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((value.length + 3) % 4)), c => c.charCodeAt(0));
const encode = value => btoa(String.fromCharCode(...new Uint8Array(value))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const jsonify = credential => ({
  id: credential.id, rawId: encode(credential.rawId), type: credential.type,
  response: Object.fromEntries(Object.entries(credential.response.toJSON ? credential.response.toJSON() : {}).map(([k, v]) => [k, v]))
});
async function run() {
  const register = initial.mode === 'register';
  const prefix = register ? 'register' : 'authenticate';
  const body = register ? initial : {username: initial.username};
  const optionResponse = await fetch(`/api/${prefix}/options`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const options = await optionResponse.json();
  if (!optionResponse.ok) throw new Error(options.error);
  options.challenge = decode(options.challenge);
  if (register) {
    options.user.id = decode(options.user.id);
    (options.excludeCredentials || []).forEach(item => item.id = decode(item.id));
  } else (options.allowCredentials || []).forEach(item => item.id = decode(item.id));
  const credential = register ? await navigator.credentials.create({publicKey: options}) : await navigator.credentials.get({publicKey: options});
  const response = await fetch(`/api/${prefix}/verify`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(jsonify(credential))});
  const result = await response.json();
  if (!response.ok) throw new Error(result.error);
  document.querySelector('#status').textContent = 'Erfolgreich';
  document.querySelector('#result').textContent = JSON.stringify(result);
}
run().catch(error => document.querySelector('#status').textContent = `Fehler: ${error.message}`);
</script>
</body>
</html>
